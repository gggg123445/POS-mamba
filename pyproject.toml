[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-mamba"
version = "0.1.0"
description = "POS-Mamba for patient-grouped coronary stenosis grading from multiview CPR"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.47,<5",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "Pillow>=10,<13", "tqdm>=4.66,<5", "timm>=1.0.15,<2", "einops>=0.8,<1"
]

[project.optional-dependencies]
train = ["mamba-ssm==2.2.4"]
dev = ["pytest>=8,<10"]

[project.scripts]
pos-mamba = "pos_mamba.cli:main"

[project.urls]
Repository = "https://github.com/gggg123445/POS-mamba"

[tool.setuptools.packages.find]
include = ["pos_mamba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
